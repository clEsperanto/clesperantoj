name: ClesperantoJ tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: macos-14
    strategy:
      matrix:
        java: [11, 21]

    name: Test with Java ${{ matrix.java }}
    steps:
      - uses: actions/checkout@v7.0.1
      
      - name: Cache CMake build
        uses: actions/cache@v6
        with:
          path: native/clesperantoj/cppbuild
          key: cmake-${{ runner.os }}-${{ hashFiles('native/clesperantoj/CMakeLists.txt', 'native/clesperantoj/clic/CMakeLists.txt', 'pom.xml') }}
          restore-keys: |
            cmake-${{ runner.os }}-

      - name: Setup java
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java }}
          distribution: 'zulu'
          architecture: 'x64'
          cache: maven

      - name: Install POCL (CPU OpenCL device)
        run: brew install pocl

      - name: Execute the tests
        run: mvn clean test
