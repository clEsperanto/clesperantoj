name: ClesperantoJ tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: macos-14
    strategy:
      matrix:
        java: [8, 11, 17, 21]

    name: Test with Java ${{ matrix.java }}
    steps:
      - uses: actions/checkout@v7.0.1
      
      - name: Setup java
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java }}
          distribution: 'zulu'

      - name: Execute the tests
        run: mvn clean test -X
